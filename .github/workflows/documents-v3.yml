name: Temporary Intakelet actual installed documents
on:
  push:
    branches: ['qa/intakelet-documents-20261115']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Qualify actual installed parsers, OCR, review, types and guide
        env:
          INTAKELET_DOCUMENT_PHASE: qualify
          INTAKELET_DOCUMENT_SECONDS: '450'
          INTAKELET_DOCUMENT_ARTIFACT: ${{ runner.temp }}/intakelet-document-qualified
        run: python3 tests/scripts/qualify-documents.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-document-qualified-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-document-qualified
          if-no-files-found: error
          retention-days: 7
