name: Temporary Intakelet document lock
on:
  push:
    branches: ['qa/intakelet-documents-20261115']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Generate the explicit dependency lock in owned scratch
        env:
          INTAKELET_DOCUMENT_PHASE: lock
          INTAKELET_DOCUMENT_SECONDS: '160'
          INTAKELET_DOCUMENT_ARTIFACT: ${{ runner.temp }}/intakelet-document-lock
        run: python3 tests/scripts/qualify-documents.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-document-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-document-lock
          if-no-files-found: error
          retention-days: 7
