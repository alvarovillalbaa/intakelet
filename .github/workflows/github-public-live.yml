name: Temporary Intakelet 0.4.0 real public source qualification
on:
  push:
    branches: ['qa/intakelet-github-public-20261115']
permissions:
  contents: read
jobs:
  actual-candidate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Pack, install and read real public GitHub with source V2
        env:
          INTAKELET_GITHUB_ARTIFACT: ${{ runner.temp }}/intakelet-github-candidate
        run: python3 tests/scripts/qualify-github-live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-github-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-github-candidate
          if-no-files-found: error
          retention-days: 7
