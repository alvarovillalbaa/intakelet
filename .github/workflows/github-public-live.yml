name: Temporary Intakelet 0.4.0 publication, hosted acceptance and retirement
on:
  push:
    branches: ['qa/intakelet-github-public-20261115']
permissions:
  contents: write
jobs:
  publish-hosted-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Publish only the accepted archive and verify anonymous downloads
        env:
          INTAKELET_RELEASE_SOURCE: 1af59b022b02be680fef4f03dbec7489827c232e
          INTAKELET_RELEASE_TOKEN: ${{ github.token }}
          INTAKELET_GITHUB_ARCHIVE_SHA256: 64902be7e0cec56e647c6b9be464abba503ce7e6423aec2266e3c40d1dda0f35
          INTAKELET_GITHUB_QUALIFIED_SOURCE: 71a786bb176585d395f6e7e6aa137ec5464c0523
          INTAKELET_GITHUB_QUALIFICATION_RUN: '43726211283'
          INTAKELET_PUBLICATION_OUTPUT: ${{ runner.temp }}/intakelet-github-publication
        run: python3 tests/scripts/publish-github-source.py
      - name: Verify exact package, public bodies and native mobile guide
        env:
          INTAKELET_DOCUMENT_PHASE: hosted
          INTAKELET_DOCUMENT_SECONDS: '200'
          INTAKELET_DOCUMENT_ARCHIVE_SHA256: 64902be7e0cec56e647c6b9be464abba503ce7e6423aec2266e3c40d1dda0f35
          INTAKELET_DOCUMENT_ARTIFACT: ${{ runner.temp }}/intakelet-github-hosted
          INTAKELET_GUIDE_URL: https://intakelet.vercel.app
        run: python3 tests/scripts/qualify-documents.py
      - name: Retire only the owned temporary workflow and branch
        env:
          INTAKELET_RELEASE_SOURCE: 1af59b022b02be680fef4f03dbec7489827c232e
          INTAKELET_RETIRE_TOKEN: ${{ github.token }}
          INTAKELET_RETIRE_OUTPUT: ${{ runner.temp }}/intakelet-github-retirement
        run: python3 tests/scripts/retire-github-live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-github-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/intakelet-github-publication
            ${{ runner.temp }}/intakelet-github-hosted
            ${{ runner.temp }}/intakelet-github-retirement
          if-no-files-found: error
          retention-days: 7
