name: Temporary Intakelet 0.2 qualification
on:
  push:
    branches: ['qa/intakelet-onboarding-20261115']
permissions:
  contents: write
jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Retire only the accepted owned control
        env:
          INTAKELET_RELEASE_SOURCE: 0ffde072df73287ae94ca2b35c335a89bc5b973a
          INTAKELET_RETIRE_TOKEN: ${{ github.token }}
          INTAKELET_RETIRE_OUTPUT: ${{ runner.temp }}/intakelet-v2-retirement
        run: python3 tests/scripts/retire-v2.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-v2-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-v2-retirement
          if-no-files-found: error
          retention-days: 7
