name: Temporary Intakelet 0.2 qualification
on:
  push:
    branches: ['qa/intakelet-onboarding-20261115']
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Owned package and native qualification
        env:
          INTAKELET_PHASE: final-native
          INTAKELET_CASES: N01,N03,N05-320
          INTAKELET_OUTPUT: ${{ runner.temp }}/intakelet-v2-artifact
        run: python3 tests/scripts/qualify-v2.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-v2-artifact
          if-no-files-found: error
          retention-days: 7
