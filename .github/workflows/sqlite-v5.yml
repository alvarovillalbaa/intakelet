name: Temporary Intakelet SQLite lock metadata
on:
  push:
    branches: ['qa/intakelet-sqlite-20261115']
permissions:
  contents: read
jobs:
  lock-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Generate only the new edition lock metadata
        env:
          INTAKELET_SQLITE_PHASE: lock
          INTAKELET_SQLITE_ARTIFACT: ${{ runner.temp }}/intakelet-sqlite-lock
        run: python3 tests/scripts/qualify-sqlite.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-sqlite-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/intakelet-sqlite-lock
          if-no-files-found: error
          retention-days: 7
