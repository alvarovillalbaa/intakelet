name: Temporary Intakelet 0.5.0 publication, hosted guide and retirement
on:
  push:
    branches: ['qa/intakelet-sqlite-20261115']
permissions:
  contents: write
jobs:
  publish-hosted-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Publish the accepted archive, SQL and public acceptance metadata
        env:
          INTAKELET_RELEASE_SOURCE: 1e401b943afd851519b7a08a566083c594fa1fd8
          INTAKELET_RELEASE_TOKEN: ${{ github.token }}
          INTAKELET_SQLITE_ARCHIVE_SHA256: fa92aa9478c9027e1cec302580165a45f3631c0f808b9d8989defd676047e38a
          INTAKELET_SQLITE_QUALIFIED_SOURCE: 84c1ffbf860f2793236266b581eda59033ad93a2
          INTAKELET_SQLITE_QUALIFICATION_RUN: '43747746882'
          INTAKELET_PUBLICATION_OUTPUT: ${{ runner.temp }}/intakelet-sqlite-publication
        run: python3 tests/scripts/publish-sqlite.py
      - name: Check exact archive, public bodies and native mobile guide
        env:
          INTAKELET_DOCUMENT_PHASE: hosted
          INTAKELET_DOCUMENT_SECONDS: '200'
          INTAKELET_DOCUMENT_ARCHIVE_SHA256: fa92aa9478c9027e1cec302580165a45f3631c0f808b9d8989defd676047e38a
          INTAKELET_DOCUMENT_ARTIFACT: ${{ runner.temp }}/intakelet-sqlite-hosted
          INTAKELET_GUIDE_URL: https://intakelet.vercel.app
        run: python3 tests/scripts/qualify-documents.py
      - name: Retire only the owned workflow and temporary branch
        env:
          INTAKELET_RELEASE_SOURCE: 1e401b943afd851519b7a08a566083c594fa1fd8
          INTAKELET_RETIRE_TOKEN: ${{ github.token }}
          INTAKELET_RETIRE_OUTPUT: ${{ runner.temp }}/intakelet-sqlite-retirement
        run: python3 tests/scripts/retire-sqlite.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intakelet-sqlite-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/intakelet-sqlite-publication
            ${{ runner.temp }}/intakelet-sqlite-hosted
            ${{ runner.temp }}/intakelet-sqlite-retirement
          if-no-files-found: error
          retention-days: 7
